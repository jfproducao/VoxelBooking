services:
  - type: web
    name: voxelbooking
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DATABASE_SSL_CA
        value: config/prod-ca-2021.crt
      - key: APP_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
